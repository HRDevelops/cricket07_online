name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Distribution Bundle
        run: |
          mkdir -p dist/build
          cp web/index.html dist/
          cp web/loader.js dist/
          cp web/netplay.js dist/
          cp web/audio-worklet.js dist/
          cp web/coi-serviceworker.min.js dist/
          cp web/_headers dist/
          if [ -d "web/build" ]; then
            cp -r web/build/* dist/build/
          elif [ -d "build_web/www" ]; then
            cp -r build_web/www/* dist/build/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
